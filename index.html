<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEST OF LUCK DIAMOND TOP UP</title>
  <style>
    body {
      background-color: skyblue;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    .container {
      background: white;
      border-radius: 10px;
      padding: 20px;
      max-width: 520px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
    }
    input, select, textarea, button {
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
    }
    textarea {
      resize: none;
      cursor: pointer;
      font-family: monospace;
      user-select: all;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      height: 140px;
    }
    input[readonly], textarea[readonly] {
      background-color: #f0f0f0;
      cursor: not-allowed;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      transition: background-color 0.3s ease;
      border-radius: 5px;
      user-select: none;
      position: relative;
    }
    button:hover {
      background-color: #218838;
    }
    #totalPrice {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
      color: #155724;
      background: #d4edda;
      border: 1px solid #c3e6cb;
      padding: 10px;
      border-radius: 5px;
      user-select: none;
    }
    #paymentDetailsContainer {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
    }
    #paymentDetails {
      flex: 1;
      resize: none;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      height: 140px;
      user-select: all;
    }
    #copyBtn {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      height: 36px;
      margin-top: 6px;
      user-select: none;
      transition: background-color 0.3s ease;
      flex-shrink: 0;
    }
    #copyBtn:hover {
      background-color: #0056b3;
    }
    #orderTime {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background-color: #f0f0f0;
      cursor: not-allowed;
    }
    #loadingSpinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      z-index: 10;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg);}
      100% { transform: translate(-50%, -50%) rotate(360deg);}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>BEST OF LUCK DIAMOND TOP UP</h2>

    <p>আপনার ফ্রি ফায়ার UID লিখুন:</p>
    <input type="text" id="uid" placeholder="UID (শুধু ৯-১১ সংখ্যার)" maxlength="11"
      oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="off" required />

    <p>গেমে কি নাম দেয়া আছে?</p>
    <input type="text" id="playerName" placeholder="আপনার গেম নাম এখানে লিখুন" autocomplete="off" required />

    <p>প্যাকেজ সিলেক্ট করুন:</p>
    <select id="diamondSelect" multiple size="15" required onchange="calculateTotal()">
      <option data-price="25">25 Diamond = 25 BDT</option>
      <option data-price="40">50 Diamond = 40 BDT</option>
      <option data-price="82">115 Diamond = 82 BDT</option>
      <option data-price="160">240 Diamond = 160 BDT</option>
      <option data-price="240">355 Diamond = 240 BDT</option>
      <option data-price="316">480 Diamond = 316 BDT</option>
      <option data-price="340">505 Diamond = 340 BDT</option>
      <option data-price="392">610 Diamond = 392 BDT</option>
      <option data-price="550">850 Diamond = 550 BDT</option>
      <option data-price="700">1090 Diamond = 700 BDT</option>
      <option data-price="775">1240 Diamond = 775 BDT</option>
      <option data-price="1567">2530 Diamond = 1567 BDT</option>
      <option data-price="3124">5060 Diamond = 3124 BDT</option>
      <option data-price="6240">10120 Diamond = 6240 BDT</option>
      <!-- Level Up Packages -->
      <option data-price="390">Level Up Pass = 390 BDT</option>
      <option data-price="768">Monthly = 768 BDT</option>
      <option data-price="1530">Monthly 2x = 1530 BDT</option>
      <option data-price="165">Weekly = 165 BDT</option>
      <option data-price="325">Weekly 2x = 325 BDT</option>
      <option data-price="485">Weekly 3x = 485 BDT</option>
      <option data-price="630">Weekly 4x = 630 BDT</option>
      <option data-price="785">Weekly 5x = 785 BDT</option>
      <option data-price="43">Weekly Lite = 43 BDT</option>
      <option data-price="85">2X Weekly Lite = 85 BDT</option>
      <option data-price="127">3X Weekly Lite = 127 BDT</option>
      <option data-price="210">5X Weekly Lite = 210 BDT</option>
      <option data-price="70">3 Days Evo Access = 70 BDT</option>
      <option data-price="107">7 Days Evo Access = 107 BDT</option>
      <option data-price="308">30 Days Evo Access = 308 BDT</option>
    </select>

    <div id="totalPrice">মোট দাম: 0 BDT</div>

    <p>পেমেন্ট মেথড সিলেক্ট করুন:</p>
    <select id="paymentMethod" required onchange="showPaymentDetails()">
      <option value="" disabled selected>-- নির্বাচন করুন --</option>
      <option value="Bkash/Nagad">Bkash/Nagad = 01580495595</option>
      <option value="Rocket">Rocket = 01316019861</option>
      <option value="Upay">Upay = 01316019861</option>
      <option value="Dhaka Bank">Dhaka Bank</option>
      <option value="UCB Bank">UCB Bank</option>
      <option value="IFIC Bank">IFIC Bank</option>
    </select>

    <div id="paymentDetailsContainer">
      <textarea id="paymentDetails" readonly placeholder="পেমেন্ট ডিটেইল এখানে দেখাবে"></textarea>
      <button id="copyBtn" onclick="copyPaymentDetails()">কপি</button>
    </div>

    <p>অর্ডারের সময় ও তারিখ:</p>
    <input type="text" id="orderTime" readonly />

    <button id="submitBtn" onclick="submitOrder()">সাবমিট করুন</button>
    <div id="loadingSpinner"></div>
  </div>

  <script>
    const loadingSpinner = document.getElementById('loadingSpinner');

    function updateTime() {
      const now = new Date();
      const options = { timeZone: 'Asia/Dhaka', year:'numeric',month:'long',day:'numeric',
        hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
      document.getElementById('orderTime').value = now.toLocaleString('bn-BD',options);
    }
    setInterval(updateTime,1000);
    updateTime();

    function calculateTotal(){
      const diamondSelect=document.getElementById('diamondSelect');
      let total=0;
      for(const option of diamondSelect.selectedOptions){ total+=parseInt(option.getAttribute('data-price'),10)||0; }
      document.getElementById('totalPrice').textContent=`মোট দাম: ${total} BDT`;
      return total;
    }

    function showPaymentDetails(){
      const pm=document.getElementById('paymentMethod').value;
      const pd=document.getElementById('paymentDetails');
      let text='';
      switch(pm){
        case 'Bkash/Nagad': text='Bkash/Nagad নম্বর:\n01580495595'; break;
        case 'Rocket': text='Rocket নম্বর:\n01316019861'; break;
        case 'Upay': text='Upay নম্বর:\n01316019861'; break;
        case 'Dhaka Bank': text='Dhaka Bank\nনাম: MD MAHFUZUL ISLAM\nএকাউন্ট নাম্বার: 4111100035349\nব্রাঞ্চ: Bogura'; break;
        case 'UCB Bank': text='UCB Bank\nনাম: PREMIUM CYBER GALAXY\nএকাউন্ট নাম্বার: 0072101000007006\nব্রাঞ্চ: -'; break;
        case 'IFIC Bank': text='IFIC Bank\nনাম: MD MAHFUZUL ISLAM\nএকাউন্ট নাম্বার: 0230107830851\nব্রাঞ্চ: Bogura'; break;
      }
      pd.value=text;
    }

    function copyPaymentDetails(){
      const pd=document.getElementById('paymentDetails');
      pd.select();
      pd.setSelectionRange(0,99999);
      navigator.clipboard.writeText(pd.value);
    }

    function submitOrder(){
      const uid=document.getElementById('uid').value.trim();
      const name=document.getElementById('playerName').value.trim();
      const diamondSelect=document.getElementById('diamondSelect');
      const selectedDiamonds=Array.from(diamondSelect.selectedOptions).map(o=>`- ${o.text}`).join('\n');
      const pm=document.getElementById('paymentMethod').value;
      const pd=document.getElementById('paymentDetails').value;
      const time=document.getElementById('orderTime').value;
      const total=calculateTotal();
      if(!uid||!/^\d{9,11}$/.test(uid)||!name||diamondSelect.selectedOptions.length===0||!pm||!pd||total<=0) return;
      loadingSpinner.style.display='block';
      const msg=`✅ অর্ডার এসেছে:\n🆔 UID: ${uid}\n👤 নাম: ${name}\n💎 প্যাকেজ:\n${selectedDiamonds}\n💰 মোট দাম: ${total} BDT\n💳 পেমেন্ট মেথড: ${pm}\n📋 পেমেন্ট ডিটেইলস:\n${pd}\n⏰ অর্ডারের সময়: ${time}`;
      window.open(`https://wa.me/8801580495595?text=${encodeURIComponent(msg)}`,'_blank');
      setTimeout(()=>{loadingSpinner.style.display='none';clearForm();},1000);
    }

    function clearForm(){
      document.getElementById('uid').value='';
      document.getElementById('playerName').value='';
      const ds=document.getElementById('diamondSelect');
      for(const o of ds.options)o.selected=false;
      document.getElementById('paymentMethod').value='';
      document.getElementById('paymentDetails').value='';
      document.getElementById('totalPrice').textContent='মোট দাম: 0 BDT';
    }
  </script>
</body>
</html>
