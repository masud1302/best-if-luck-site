<script>


const loadingSpinner = document.getElementById("loadingSpinner");



// ================= TIME =================


function updateTime(){

    const now = new Date();

    const options = {

        timeZone:"Asia/Dhaka",

        year:"numeric",

        month:"long",

        day:"numeric",

        hour:"2-digit",

        minute:"2-digit",

        second:"2-digit",

        hour12:false

    };


    document.getElementById("orderTime").value =
    now.toLocaleString("bn-BD", options);

}


setInterval(updateTime,1000);

updateTime();





// ================= TOTAL PRICE =================


function calculateTotal(){

    const select =
    document.getElementById("diamondSelect");


    let total = 0;


    Array.from(select.selectedOptions).forEach(option=>{

        total += Number(option.dataset.price) || 0;

    });


    document.getElementById("totalPrice").innerText =
    `মোট দাম: ${total} BDT`;


    return total;

}





// ================= PAYMENT =================



function showPaymentDetails(){


    const method =
    document.getElementById("paymentMethod").value;


    const details =
    document.getElementById("paymentDetails");


    const instruction =
    document.getElementById("paymentInstruction");



    let number="";



    if(method==="Bkash/Nagad"){

        number="01580495595";

    }

    else if(method==="Rocket"){

        number="01316019861";

    }

    else if(method==="Upay"){

        number="01316019861";

    }

    else if(method==="Dhaka Bank"){

        number="4111100035349";

    }

    else if(method==="UCB Bank"){

        number="0072101000007006";

    }

    else if(method==="IFIC Bank"){

        number="0230107830851";

    }



    details.innerText = number;

    details.dataset.number = number;



    if(number){

        instruction.innerText =
        `নাম্বারে ক্লিক করে কপি করুন এবং ${method} এ Send Money করুন।`;

    }

    else{

        instruction.innerText="";

    }


}







// ================= COPY SYSTEM =================



async function copyPaymentDetails(){


    const number =
    document.getElementById("paymentDetails").dataset.number;



    if(!number){

        alert("আগে পেমেন্ট মেথড নির্বাচন করুন");

        return;

    }



    try{


        await navigator.clipboard.writeText(number);


        alert("নম্বর কপি হয়েছে: " + number);


    }


    catch(error){


        const temp =
        document.createElement("textarea");


        temp.value = number;


        document.body.appendChild(temp);


        temp.select();


        document.execCommand("copy");


        document.body.removeChild(temp);



        alert("নম্বর কপি হয়েছে: " + number);


    }



}







// ================= SUBMIT ORDER =================



function submitOrder(){



    const uid =
    document.getElementById("uid");


    const name =
    document.getElementById("playerName");


    const packageSelect =
    document.getElementById("diamondSelect");


    const payment =
    document.getElementById("paymentMethod");


    const paymentNumber =
    document.getElementById("paymentDetails").dataset.number || "";



    const total = calculateTotal();




    [
        uid,
        name,
        packageSelect,
        payment

    ].forEach(field=>{

        field.classList.remove("invalid");

    });




    let valid=true;



    if(!/^\d{9,11}$/.test(uid.value)){


        uid.classList.add("invalid");

        valid=false;

    }



    if(!name.value.trim()){


        name.classList.add("invalid");

        valid=false;


    }



    if(packageSelect.selectedOptions.length===0){


        packageSelect.classList.add("invalid");

        valid=false;


    }




    if(!payment.value){


        payment.classList.add("invalid");

        valid=false;


    }





    if(!paymentNumber || total<=0){


        valid=false;


    }





    if(!valid){


        alert("দয়া করে লাল চিহ্নিত ঘরগুলো পূরণ করুন।");

        return;


    }







    const selectedPackages =
    Array.from(packageSelect.selectedOptions)

    .map(item=>"- "+item.text)

    .join("\n");





    const message =

`✅ নতুন অর্ডার

🆔 UID:
${uid.value}

👤 নাম:
${name.value}

💎 প্যাকেজ:
${selectedPackages}

💰 মোট:
${total} BDT

💳 Payment:
${payment.value}

📋 Number:
${paymentNumber}

⏰ সময়:
${document.getElementById("orderTime").value}`;





    loadingSpinner.style.display="block";




    const whatsappURL =

    "https://wa.me/8801580495595?text="

    + encodeURIComponent(message);




    setTimeout(()=>{


        window.location.href = whatsappURL;


        loadingSpinner.style.display="none";


    },500);



}







// ================= CLEAR FORM =================


function clearForm(){


document.getElementById("uid").value="";

document.getElementById("playerName").value="";



const select =
document.getElementById("diamondSelect");


Array.from(select.options).forEach(option=>{

    option.selected=false;

});



document.getElementById("paymentMethod").value="";

document.getElementById("paymentDetails").innerText="";

document.getElementById("paymentDetails").dataset.number="";

document.getElementById("paymentInstruction").innerText="";


document.getElementById("totalPrice").innerText=
"মোট দাম: 0 BDT";


}




</script>
